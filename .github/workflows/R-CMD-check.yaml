name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }}${{ matrix.config.cran && ', cran' || '' }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest, r: release }
          - { os: windows-latest, r: release }
          - { os: ubuntu-latest, r: release, manual: true, long: true }
          - { os: ubuntu-latest, r: devel, http-user-agent: release }
          # as CRAN runs it: NOT_CRAN unset, so long tests and vignette code are skipped
          - { os: ubuntu-latest, r: devel, http-user-agent: release, manual: true, cran: true }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # CI is not CRAN: the long reference tests (skip_on_cran) run here
      NOT_CRAN: ${{ matrix.config.cran && 'false' || 'true' }}
      # long posterior validation tests run on one job only
      BAYESCOMPR_LONG_TESTS: ${{ matrix.config.long && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: any::rcmdcheck, any::V8
          needs: check

      # the PDF manual is built and checked on one job, as CRAN does
      - name: Install LaTeX for the PDF manual and HTML Tidy
        if: matrix.config.manual
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          upload-snapshots: true
          args: ${{ matrix.config.manual && 'c("--as-cran")' || 'c("--no-manual", "--as-cran")' }}
          build_args: ${{ matrix.config.manual && 'c("--compact-vignettes=gs+qpdf")' || 'c("--no-manual","--compact-vignettes=gs+qpdf")' }}
